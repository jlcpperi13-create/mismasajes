<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reserva tu masaje</title>
<link rel="manifest" href="manifest-cliente.json">
<meta name="theme-color" content="#8a5a44">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --c:#8a5a44; --c2:#f6efe9; --txt:#2b2420; --gris:#8c817a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#fbf8f5; color:var(--txt); }
  header { background:var(--c); color:#fff; padding:22px 18px; text-align:center; }
  header h1 { margin:0; font-size:1.4rem; }
  header p { margin:6px 0 0; opacity:.9; font-size:.95rem; }
  main { max-width:560px; margin:0 auto; padding:14px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .card h2 { margin:0 0 12px; font-size:1.05rem; color:var(--c); }
  .hidden { display:none; }
  .opcion { display:flex; justify-content:space-between; align-items:center; width:100%; padding:14px; margin-bottom:8px;
            border:2px solid #eee; border-radius:12px; background:#fff; font-size:1rem; text-align:left; cursor:pointer; }
  .opcion small { color:var(--gris); display:block; margin-top:2px; }
  .opcion.sel, .chip.sel { border-color:var(--c); background:var(--c2); }
  .scroll-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
  .chip { flex:0 0 auto; min-width:66px; padding:10px 8px; border:2px solid #eee; border-radius:12px; background:#fff; text-align:center; cursor:pointer; font-size:.9rem; }
  .chip b { display:block; font-size:1.15rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:8px; }
  label { display:block; font-size:.9rem; margin:10px 0 4px; color:var(--gris); }
  input, select, textarea { width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; font-size:1rem; font-family:inherit; }
  .btn { width:100%; padding:15px; margin-top:16px; border:0; border-radius:12px; background:var(--c); color:#fff; font-size:1.05rem; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.6; }
  .aviso { color:var(--gris); font-size:.95rem; }
  .error { color:#b3261e; margin-top:10px; }
  .resumen { background:var(--c2); border-radius:10px; padding:12px; font-size:.95rem; line-height:1.5; }
  .ok { font-size:3rem; text-align:center; }
  .micita { border-left:5px solid var(--c); background:var(--c2); border-radius:10px; padding:10px 12px; margin-bottom:8px; line-height:1.45; }
  .micita.confirmada { border-left-color:#2e7d32; } .micita.pendiente { border-left-color:#d98e04; }
  .micita.cancelada { border-left-color:#bbb; opacity:.6; }
  .etq { font-size:.72rem; font-weight:700; text-transform:uppercase; padding:2px 8px; border-radius:8px; float:right; }
  .etq.confirmada { background:#e3f1e4; color:#2e7d32; } .etq.pendiente { background:#fdf0d5; color:#d98e04; } .etq.cancelada { background:#eee; color:#777; }
  .contacto a { color:var(--c); font-weight:600; }
  .micita.pasada { border-left-color:#bbb; background:#f4f1ee; }
  .etq.pasada { background:#eee; color:#777; }
  .quitar { background:none; border:1px solid #ccc; border-radius:16px; padding:4px 12px; color:#777; font-size:.82rem; cursor:pointer; }
  .anteriores { margin-top:10px; }
  .accionesCita { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .accionesCita button { flex:1; padding:9px; border-radius:10px; font-size:.9rem; font-weight:600; cursor:pointer; border:0; }
  .bMod { background:var(--c); color:#fff; } .bCan { background:#fff; color:#b3261e; border:1px solid #e6b8b4 !important; }
  .cajaCancel { background:#fdecea; border-radius:10px; padding:10px; margin-top:8px; }
  .cajaCancel textarea { margin-top:6px; }
  .limite { font-size:.82rem; color:var(--gris); margin-top:6px; }
  .anteriores summary { cursor:pointer; color:var(--gris); font-size:.92rem; padding:6px 0; }
  .selIdioma { margin-top:12px; width:auto; padding:7px 12px; border-radius:20px; border:0; font-size:.95rem; background:#fff; color:var(--c); font-weight:600; }
  .privacidad { margin-top:14px; }
  .check { display:flex; gap:10px; align-items:flex-start; color:var(--txt); font-size:.92rem; margin:0; }
  .check input { width:auto; margin-top:3px; transform:scale(1.3); flex:0 0 auto; }
  .check a, .textoPriv a { color:var(--c); }
  .textoPriv { background:#f4f1ee; border-radius:10px; padding:12px; margin-top:10px; font-size:.82rem; line-height:1.5; color:#5a514b; }
  .textoPriv p { margin:0 0 6px; }
</style>
</head>
<body>
<header>
  <h1 id="titulo">Reserva tu masaje</h1>
  <p id="subtitulo"></p>
  <select id="selIdioma" class="selIdioma" aria-label="Idioma / Language"></select>
  <button id="btnInstalar" class="hidden" style="margin-top:12px;background:#fff;color:var(--c);border:0;border-radius:20px;padding:8px 16px;font-weight:600;font-size:.9rem" data-i18n="instalar">📲 Instalar la app</button>
</header>
<main>
  <section id="misCitas" class="card hidden">
    <h2 data-i18n="tusCitas">Tus citas</h2>
    <div id="listaMisCitas"></div>
    <p id="contactoCambio" class="aviso contacto"></p>
  </section>

  <section id="bannerEdit" class="card hidden" style="background:#fdf0d5">
    <b data-i18n="modificando">✏️ Modificando tu cita</b>
    <p id="bannerEditTxt" class="aviso" style="margin:4px 0 10px"></p>
    <p class="aviso" style="margin:0 0 10px" data-i18n-html="modificandoAyuda"></p>
    <button type="button" class="quitar" id="salirEdit" data-i18n="salirSinCambiar">✕ Salir sin cambiar</button>
  </section>

  <section id="paso1" class="card">
    <h2 data-i18n="paso1">1. Elige el masaje</h2>
    <div id="listaServicios"><p class="aviso" data-i18n="cargando">Cargando…</p></div>
  </section>

  <section id="paso2" class="card hidden">
    <h2 data-i18n="paso2">2. Elige el día</h2>
    <div id="dias" class="scroll-row"></div>
  </section>

  <section id="paso3" class="card hidden">
    <h2 data-i18n="paso3">3. Elige la hora</h2>
    <div id="horas" class="grid"></div>
  </section>

  <section id="paso4" class="card hidden">
    <h2 data-i18n="paso4">4. Tus datos</h2>
    <div id="resumen" class="resumen"></div>
    <form id="form">
      <label for="nombre" data-i18n="nombre">Nombre</label>
      <input id="nombre" required maxlength="80" autocomplete="name">
      <label for="telefono" data-i18n="telefono">Teléfono</label>
      <input id="telefono" type="tel" required maxlength="25" autocomplete="tel">
      <div id="bloqueEmail">
        <label for="email" data-i18n="emailOpc">Correo electrónico (opcional, para enviarte un recordatorio)</label>
        <input id="email" type="email" maxlength="120" autocomplete="email">
      </div>
      <label for="lugar" data-i18n="donde">¿Dónde?</label>
      <select id="lugar"></select>
      <div id="bloqueDireccion">
        <label for="direccion" id="lblDireccion">Dirección</label>
        <input id="direccion" maxlength="200">
      </div>
      <label for="notas" data-i18n="comentarios">Comentarios (opcional)</label>
      <textarea id="notas" rows="2" maxlength="300" data-i18n-ph="comentariosPh"></textarea>
      <div class="privacidad">
        <label class="check"><input type="checkbox" id="acepto" required>
          <span data-i18n-html="acepto">He leído y acepto la <a href="#" id="verPriv">política de privacidad</a></span></label>
        <div id="textoPriv" class="textoPriv hidden"></div>
      </div>
      <button class="btn" id="btnEnviar" type="submit" data-i18n="solicitar">Solicitar reserva</button>
      <p id="error" class="error"></p>
    </form>
  </section>

  <section id="hecho" class="card hidden"></section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where, writeBatch, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import * as CFG from "./firebase-config.js";
import { IDIOMAS, detectarIdioma } from "./idiomas.js";
const { firebaseConfig } = CFG;

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);

// ---------- IDIOMAS ----------
const LANG = detectarIdioma(), TX = IDIOMAS[LANG], LOC = TX._locale;
const t = (k, v = {}) => { const x = TX[k] ?? IDIOMAS.es[k] ?? k; return typeof x === 'function' ? x(v) : String(x).replace(/\{(\w+)\}/g, (_, n) => v[n] ?? ''); };
document.documentElement.lang = LANG;
document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
document.querySelectorAll('[data-i18n-html]').forEach(e => e.innerHTML = t(e.dataset.i18nHtml));
document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
$('selIdioma').innerHTML = Object.entries(IDIOMAS).map(([k, d]) => `<option value="${k}" ${k === LANG ? 'selected' : ''}>${d._bandera} ${d._nombre}</option>`).join('');
$('selIdioma').onchange = () => { try { localStorage.setItem('idioma', $('selIdioma').value); } catch {} location.reload(); };
// Nombre del masaje en el idioma del cliente (si ella lo tradujo; si no, inglés; si no, español)
const nomServ = x => !x ? '' : (LANG === 'es' ? x.nombre : (x['nombre_' + LANG] || x.nombre_en || x.nombre));

// ---------- app instalable (alcance solo index.html, separado del panel) ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope: './index.html' }).catch(console.error);
let promptInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstalar = e; $('btnInstalar').classList.remove('hidden'); });
$('btnInstalar').onclick = async () => {
  if (!promptInstalar) return;
  promptInstalar.prompt(); await promptInstalar.userChoice;
  promptInstalar = null; $('btnInstalar').classList.add('hidden');
};
window.addEventListener('appinstalled', () => $('btnInstalar').classList.add('hidden'));

// ---------- utilidades de horas ----------
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const toHM = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const corto = (d, o) => d.toLocaleDateString(LOC, o).replace('.', '');
// ---------- "Tus citas": se guardan en este móvil ----------
const leerMias = () => { try { return JSON.parse(localStorage.getItem('misCitas') || '[]'); } catch { return []; } };
const guardarMias = l => { try { localStorage.setItem('misCitas', JSON.stringify(l)); } catch {} };
const fechaLarga = f => new Date(f + 'T12:00:00').toLocaleDateString(LOC, { weekday: 'long', day: 'numeric', month: 'long' });
const fechaHora = (f, ini) => t('fechaHora', { fecha: fechaLarga(f), hora: toHM(ini) });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const LUGARES = { hotel: t('lugarHotel'), domicilio: t('lugarDomicilio'), centro: t('lugarCentro') };

// Calcula los huecos libres de un día para un masaje de "dur" minutos
function huecos(cfg, fecha, dur, ocupados, bloqueos) {
  const dow = new Date(fecha + 'T12:00:00').getDay();
  const h = cfg.horario?.[dow];
  if (!h || !h.activo) return [];
  const ini = toMin(h.inicio), fin = toMin(h.fin);
  const paso = Number(cfg.intervalo) || 30, margen = Number(cfg.margen) || 0;
  const busy = [
    ...ocupados.map(o => [o.ini - margen, o.fin + margen]),
    ...bloqueos.map(b => b.todoDia ? [0, 1440] : [b.ini, b.fin])
  ];
  let minimo = -1;
  if (fecha === ymd(new Date())) {
    const n = new Date();
    minimo = n.getHours() * 60 + n.getMinutes() + (Number(cfg.antelacion) || 0);
  }
  const r = [];
  for (let t = ini; t + dur <= fin; t += paso) {
    if (t < minimo) continue;
    if (busy.some(([a, b]) => t < b && t + dur > a)) continue;
    r.push(t);
  }
  return r;
}

async function cargarDia(fecha) {
  const [oc, bl] = await Promise.all([
    getDocs(query(collection(db, 'ocupado'), where('fecha', '==', fecha))),
    getDocs(query(collection(db, 'bloqueos'), where('fecha', '==', fecha)))
  ]);
  return { ocupados: oc.docs.filter(d => !editando || d.id !== editando.id).map(d => d.data()), bloqueos: bl.docs.map(d => d.data()) };
}

// ---------- estado ----------
let cfg = null, servicios = [], sel = { servicio: null, fecha: null, hora: null };
let editando = null;   // { id, dato } cuando el cliente está modificando una cita

async function init() {
  const c = await getDoc(doc(db, 'config', 'ajustes'));
  if (!c.exists()) { $('listaServicios').innerHTML = `<p class="aviso">${t('noAbiertas')}</p>`; return; }
  cfg = c.data();
  $('titulo').textContent = cfg.nombre || t('tituloDefecto');
  document.title = cfg.nombre || t('tituloDefecto');
  $('subtitulo').textContent = (LANG === 'es' ? cfg.mensaje : (cfg['mensaje_' + LANG] || cfg.mensaje_en || cfg.mensaje)) || '';

  const s = await getDocs(collection(db, 'servicios'));
  servicios = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.activo !== false)
    .sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0) || a.duracion - b.duracion);
  pintarServicios();

  const lug = Object.entries(LUGARES).filter(([k]) => cfg.lugares?.[k]);
  $('lugar').innerHTML = lug.map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  $('lugar').onchange = ajustarDireccion;
  ajustarDireccion();
  pintarPrivacidad();
  $('bloqueEmail').classList.toggle('hidden', !cfg.recordatoriosEmail);
}

function pintarPrivacidad() {
  const mail = esc(cfg.emailPriv || '');
  $('textoPriv').innerHTML = t('priv', {
    resp: esc(cfg.responsable || cfg.nombre || ''),
    nif: cfg.nif ? ` (NIF ${esc(cfg.nif)})` : '',
    dir: cfg.direccionPriv ? `, ${esc(cfg.direccionPriv)}` : '',
    mail: mail ? `<a href="mailto:${mail}">${mail}</a>` : '',
    email: !!cfg.recordatoriosEmail, sms: !!cfg.recordatoriosSMS
  });
}
$('verPriv').onclick = e => { e.preventDefault(); $('textoPriv').classList.toggle('hidden'); };

function ajustarDireccion() {
  const v = $('lugar').value;
  $('bloqueDireccion').classList.toggle('hidden', v === 'centro');
  $('lblDireccion').textContent = v === 'hotel' ? t('hotelHab') : t('direccionCompleta');
  $('direccion').required = v !== 'centro';
}

function pintarServicios() {
  if (!servicios.length) { $('listaServicios').innerHTML = `<p class="aviso">${t('noMasajes')}</p>`; return; }
  $('listaServicios').innerHTML = servicios.map(s => `
    <button class="opcion ${sel.servicio?.id === s.id ? 'sel' : ''}" data-id="${s.id}">
      <span>${esc(nomServ(s))}<small>${s.duracion} min</small></span>
      ${cfg.mostrarPrecios !== false && s.precio ? `<b>${esc(s.precio)} €</b>` : ''}
    </button>`).join('');
  $('listaServicios').querySelectorAll('button').forEach(b => b.onclick = () => {
    sel.servicio = servicios.find(s => s.id === b.dataset.id);
    sel.fecha = sel.hora = null;
    pintarServicios(); pintarDias();
    ['paso3', 'paso4'].forEach(p => $(p).classList.add('hidden'));
    $('paso2').classList.remove('hidden');
    $('paso2').scrollIntoView({ behavior: 'smooth' });
  });
}

function pintarDias() {
  const n = Number(cfg.diasVista) || 30, hoy = new Date(), html = [];
  for (let i = 0; i < n; i++) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + i);
    if (!cfg.horario?.[d.getDay()]?.activo) continue;
    const f = ymd(d);
    html.push(`<button class="chip ${sel.fecha === f ? 'sel' : ''}" data-f="${f}">${i === 0 ? t('hoy') : corto(d, { weekday: 'short' }).slice(0, 4).replace(/(...)\w$/, '$1')}<b>${d.getDate()}</b>${corto(d, { month: 'short' })}</button>`);
  }
  $('dias').innerHTML = html.join('') || `<p class="aviso">${t('noDias')}</p>`;
  $('dias').querySelectorAll('button').forEach(b => b.onclick = () => elegirDia(b.dataset.f));
}

async function elegirDia(f) {
  sel.fecha = f; sel.hora = null;
  pintarDias();
  $('paso4').classList.add('hidden');
  $('paso3').classList.remove('hidden');
  $('horas').innerHTML = `<p class="aviso">${t('buscando')}</p>`;
  const { ocupados, bloqueos } = await cargarDia(f);
  const libres = huecos(cfg, f, Number(sel.servicio.duracion), ocupados, bloqueos);
  if (!libres.length) { $('horas').innerHTML = `<p class="aviso">${t('noHuecos')}</p>`; return; }
  $('horas').innerHTML = libres.map(t => `<button class="chip" data-t="${t}"><b>${toHM(t)}</b></button>`).join('');
  $('horas').querySelectorAll('button').forEach(b => b.onclick = () => {
    sel.hora = Number(b.dataset.t);
    $('horas').querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b));
    $('resumen').innerHTML = `<b>${esc(nomServ(sel.servicio))}</b> (${sel.servicio.duracion} min)<br>${fechaHora(sel.fecha, sel.hora)}`;
    $('paso4').classList.remove('hidden');
    $('paso4').scrollIntoView({ behavior: 'smooth' });
  });
}

$('form').onsubmit = async e => {
  e.preventDefault();
  $('error').textContent = '';
  $('btnEnviar').disabled = true;
  try {
    const dur = Number(sel.servicio.duracion);
    // Volvemos a comprobar que el hueco sigue libre
    const { ocupados, bloqueos } = await cargarDia(sel.fecha);
    if (!huecos(cfg, sel.fecha, dur, ocupados, bloqueos).includes(sel.hora)) {
      $('error').textContent = t('huecoOcupado');
      elegirDia(sel.fecha);
      return;
    }
    if (editando) { await guardarCambios(dur); return; }
    const telNorm = $('telefono').value.replace(/\D/g, '');
    if (telNorm.length < 9) { $('error').textContent = t('revisaTel'); return; }
    const estado = cfg.autoConfirmar ? 'confirmada' : 'pendiente';
    const ref = doc(collection(db, 'citas'));
    const batch = writeBatch(db);
    batch.set(ref, {
      servicioId: sel.servicio.id, servicio: sel.servicio.nombre, duracion: dur,
      precio: sel.servicio.precio || '',
      fecha: sel.fecha, ini: sel.hora, fin: sel.hora + dur,
      nombre: $('nombre').value.trim(), telefono: $('telefono').value.trim(), email: $('email').value.trim(), telNorm,
      lugar: $('lugar').value, direccion: $('direccion').value.trim(), notas: $('notas').value.trim(),
      estado, origen: 'web', creado: serverTimestamp(), idioma: LANG,
      aceptaPrivacidad: $('acepto').checked, fechaAceptacion: serverTimestamp()
    });
    batch.set(doc(db, 'ocupado', ref.id), { fecha: sel.fecha, ini: sel.hora, fin: sel.hora + dur });
    await batch.commit();
    guardarMias([...leerMias(), { id: ref.id, fecha: sel.fecha, ini: sel.hora, servicio: sel.servicio.nombre }]);
    // Aviso push a la masajista (no bloquea la reserva si falla)
    if (CFG.FUNCION_URL) fetch(CFG.FUNCION_URL + '?accion=nueva&id=' + encodeURIComponent(ref.id), { mode: 'no-cors' }).catch(() => {});

    ['paso1', 'paso2', 'paso3', 'paso4'].forEach(p => $(p).classList.add('hidden'));
    $('hecho').classList.remove('hidden');
    $('hecho').innerHTML = `
      <div class="ok">✓</div>
      <h2 style="text-align:center">${estado === 'confirmada' ? t('reservaConfirmada') : t('solicitudEnviada')}</h2>
      <div class="resumen">${esc(nomServ(sel.servicio))}<br>${fechaHora(sel.fecha, sel.hora)}</div>
      <p class="aviso">${estado === 'confirmada' ? t('teEsperamos') : t('teContactaremos')}</p>
      <p class="aviso">${t('puedesVolver')}</p>
      <button class="btn" onclick="location.reload()">${t('verMisCitas')}</button>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    console.error(err);
    if (err && err.code === 'permission-denied' && !editando) {
      const tel = cfg?.telefonoContacto;
      $('error').innerHTML = t('noCompletar') + ' ' + (tel ? t('contactaTel', { tel: `<a href="tel:${esc(tel)}">${esc(tel)}</a>` }) : t('contactaTelSin'));
    } else $('error').textContent = t('errorEnvio');
  } finally {
    $('btnEnviar').disabled = false;
  }
};

// ---------- MODIFICAR / CANCELAR (cliente) ----------
const avisar = id => { if (CFG.FUNCION_URL) fetch(CFG.FUNCION_URL + '?accion=cambio&id=' + encodeURIComponent(id), { mode: 'no-cors' }).catch(() => {}); };
const horasHasta = d => (new Date(d.fecha + 'T' + toHM(d.ini) + ':00') - new Date()) / 3600000;
const limiteHoras = () => { const n = Number(cfg?.limiteCambios); return isNaN(n) ? 24 : n; };
const datosMias = {};
const nomCita = d => nomServ(servicios.find(x => x.id === d.servicioId)) || d.servicio;

async function empezarEdicion(id) {
  const dato = datosMias[id]; if (!dato) return;
  if (horasHasta(dato) < limiteHoras()) { alert(t('menosHorasAlert', { h: limiteHoras() })); return; }
  editando = { id, dato };
  $('misCitas').classList.add('hidden'); $('hecho').classList.add('hidden');
  $('bannerEdit').classList.remove('hidden');
  $('bannerEditTxt').innerHTML = t('tuCitaActual', { servicio: esc(nomCita(dato)), fechaHora: fechaHora(dato.fecha, dato.ini) });
  // Rellenamos el formulario con sus datos
  $('nombre').value = dato.nombre || ''; $('telefono').value = dato.telefono || ''; $('email').value = dato.email || '';
  if ([...$('lugar').options].some(o => o.value === dato.lugar)) $('lugar').value = dato.lugar;
  ajustarDireccion();
  $('direccion').value = dato.direccion || ''; $('notas').value = dato.notas || '';
  $('acepto').checked = true;
  $('btnEnviar').textContent = t('guardarCambios');
  // Masaje, día y hora actuales ya marcados
  sel.servicio = servicios.find(x => x.id === dato.servicioId) || null;
  sel.fecha = sel.hora = null;
  pintarServicios();
  ['paso2', 'paso3', 'paso4'].forEach(p => $(p).classList.add('hidden'));
  if (sel.servicio) {
    pintarDias(); $('paso2').classList.remove('hidden');
    await elegirDia(dato.fecha);
    const b = $('horas').querySelector(`[data-t="${dato.ini}"]`);
    if (b) b.click();
  }
  $('bannerEdit').scrollIntoView({ behavior: 'smooth' });
}
$('salirEdit').onclick = () => location.reload();

async function guardarCambios(dur) {
  const { id, dato } = editando;
  const cambioHorario = sel.fecha !== dato.fecha || sel.hora !== dato.ini || sel.servicio.id !== dato.servicioId;
  const estado = cambioHorario && dato.estado === 'confirmada' ? 'pendiente' : dato.estado;
  const cambios = {
    servicioId: sel.servicio.id, servicio: sel.servicio.nombre, duracion: dur, precio: sel.servicio.precio || '',
    fecha: sel.fecha, ini: sel.hora, fin: sel.hora + dur,
    nombre: $('nombre').value.trim(), telefono: $('telefono').value.trim(), email: $('email').value.trim(),
    lugar: $('lugar').value, direccion: $('direccion').value.trim(), notas: $('notas').value.trim(),
    estado, modificadaPorCliente: true, fechaModificacion: serverTimestamp(), avisoCambio: 'pendiente'
  };
  if (cambioHorario) { cambios.recordatorioEmail = false; cambios.recordatorioSMS = false; }
  const batch = writeBatch(db);
  batch.update(doc(db, 'citas', id), cambios);
  batch.set(doc(db, 'ocupado', id), { fecha: sel.fecha, ini: sel.hora, fin: sel.hora + dur });
  await batch.commit();
  guardarMias(leerMias().map(x => x.id === id ? { ...x, fecha: sel.fecha, ini: sel.hora, servicio: sel.servicio.nombre } : x));
  avisar(id);
  editando = null;
  ['bannerEdit', 'paso1', 'paso2', 'paso3', 'paso4'].forEach(p => $(p).classList.add('hidden'));
  $('hecho').classList.remove('hidden');
  $('hecho').innerHTML = `
    <div class="ok">✓</div>
    <h2 style="text-align:center">${t('cambiosGuardados')}</h2>
    <div class="resumen">${esc(nomServ(sel.servicio))}<br>${fechaHora(sel.fecha, sel.hora)}</div>
    <p class="aviso">${estado === 'pendiente' ? t('quedaPendiente') : t('sigueConfirmada')}</p>
    <button class="btn" onclick="location.reload()">${t('volverMisCitas')}</button>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function cancelarMia(id, motivo) {
  const batch = writeBatch(db);
  batch.update(doc(db, 'citas', id), { estado: 'cancelada', motivoCancelacion: motivo, canceladaPor: 'cliente',
    fechaCancelacion: serverTimestamp(), avisoCambio: 'pendiente' });
  batch.delete(doc(db, 'ocupado', id));
  await batch.commit();
  avisar(id);
  pintarMisCitas();
}

async function pintarMisCitas() {
  const hoyStr = ymd(new Date());
  const mias = leerMias().sort((a, b) => a.fecha.localeCompare(b.fecha) || a.ini - b.ini);
  if (!mias.length) { $('misCitas').classList.add('hidden'); return; }
  const proximas = [], anteriores = [];
  for (const x of mias) {
    let estado = 'pendiente', dato = x;
    try {
      const d = await getDoc(doc(db, 'citas', x.id));
      if (d.exists()) { dato = { ...x, ...d.data() }; estado = d.data().estado; } else estado = 'cancelada';
    } catch { estado = '…'; }
    const pasada = x.fecha < hoyStr || estado === 'realizada';
    const txt = pasada && estado !== 'cancelada'
      ? (estado === 'realizada' ? t('est_realizada') : t('est_pasada'))
      : (['pendiente', 'confirmada', 'cancelada'].includes(estado) ? t('est_' + estado) : estado);
    const clase = pasada && estado !== 'cancelada' ? 'pasada' : estado;
    const quitable = pasada || estado === 'cancelada';
    datosMias[x.id] = { ...dato, estado };
    const editable = !pasada && (estado === 'pendiente' || estado === 'confirmada');
    const aTiempo = editable && horasHasta(dato) >= limiteHoras();
    const html = `<div class="micita ${clase}"><span class="etq ${clase}">${txt}</span>
      <b>${esc(nomCita(dato))}</b><br>${fechaHora(dato.fecha, dato.ini)}
      ${estado === 'cancelada' && dato.motivoCancelacion ? `<br><small>${t('motivo')}: ${esc(dato.motivoCancelacion)}</small>` : ''}
      ${quitable ? `<div style="text-align:right;margin-top:6px"><button class="quitar" data-quitar="${esc(x.id)}">${t('quitar')}</button></div>` : ''}
      ${aTiempo ? `<div class="accionesCita"><button class="bMod" data-mod="${esc(x.id)}">${t('modificar')}</button><button class="bCan" data-can="${esc(x.id)}">${t('cancelarCita')}</button></div>
        <div class="cajaCancel hidden" data-caja="${esc(x.id)}"><b style="color:#b3261e">${t('cancelarPregunta')}</b>
          <textarea rows="2" maxlength="200" placeholder="${t('motivoOpc')}"></textarea>
          <div class="accionesCita"><button class="bCan" data-okcan="${esc(x.id)}">${t('siCancelar')}</button><button class="bMod" data-nocan="${esc(x.id)}">${t('noMantener')}</button></div></div>`
        : editable ? `<div class="limite">${t('menosHoras', { h: limiteHoras() })}</div>` : ''}</div>`;
    (pasada ? anteriores : proximas).push(html);
  }
  $('listaMisCitas').innerHTML =
    (proximas.length ? proximas.join('') : `<p class="aviso">${t('noProximas')}</p>`) +
    (anteriores.length ? `<details class="anteriores" ${proximas.length ? '' : 'open'}><summary>${t('anteriores', { n: anteriores.length })}</summary>${anteriores.reverse().join('')}</details>` : '');
  const L = $('listaMisCitas');
  L.querySelectorAll('[data-mod]').forEach(b => b.onclick = () => empezarEdicion(b.dataset.mod));
  L.querySelectorAll('[data-can]').forEach(b => b.onclick = () => L.querySelector(`[data-caja="${b.dataset.can}"]`).classList.remove('hidden'));
  L.querySelectorAll('[data-nocan]').forEach(b => b.onclick = () => L.querySelector(`[data-caja="${b.dataset.nocan}"]`).classList.add('hidden'));
  L.querySelectorAll('[data-okcan]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await cancelarMia(b.dataset.okcan, L.querySelector(`[data-caja="${b.dataset.okcan}"] textarea`).value.trim()); }
    catch (e) { console.error(e); alert(t('noCancelar')); b.disabled = false; }
  });
  $('listaMisCitas').querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => {
    guardarMias(leerMias().filter(x => x.id !== b.dataset.quitar));
    pintarMisCitas();
  });
  const tel = cfg?.telefonoContacto;
  $('contactoCambio').innerHTML = tel && proximas.length
    ? t('necesitasCambiar', { tel: `<a href="tel:${esc(tel)}">${esc(tel)}</a>`,
        wa: `<a target="_blank" href="https://wa.me/${String(tel).replace(/\D/g, '').replace(/^(\d{9})$/, '34$1')}">WhatsApp</a>` })
    : '';
  $('misCitas').classList.remove('hidden');
}

init().then(pintarMisCitas).catch(err => { console.error(err); $('listaServicios').innerHTML = `<p class="error">${t('noCargar')}</p>`; });
</script>
</body>
</html>
